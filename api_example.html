<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SGRGZRV5FR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SGRGZRV5FR');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas / API Example</title>
  <style>
    :root { --ink: #191919; --paper: #f3f0e9; --panel: #ece7df; --coral: #ff674d; --blue: #3f62ff; --muted: #716d65; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, serif; }
    .page { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
    .eyebrow, label, button, .status, code { font-family: monospace; text-transform: uppercase; letter-spacing: .08em; }
    .eyebrow { color: var(--muted); font-size: 11px; }
    h1 { max-width: 660px; margin: 14px 0; font-size: clamp(42px, 7vw, 78px); line-height: .9; letter-spacing: -.07em; }
    h1 em { color: var(--coral); font-style: normal; }
    .intro { max-width: 580px; color: #514d48; line-height: 1.5; font-size: 17px; }
    .panel { margin-top: 28px; padding: 24px; border: 1px solid var(--ink); background: var(--panel); }
    .panel h2 { margin: 0 0 18px; font-size: 27px; letter-spacing: -.04em; }
    .auth-grid, .variables { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 10px; }
    input, select { width: 100%; border: 1px solid var(--ink); padding: 12px; background: var(--paper); color: var(--ink); font: 15px Georgia, serif; }
    input[type="color"] { height: 43px; padding: 4px; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
    button { border: 1px solid var(--ink); padding: 12px 16px; background: var(--ink); color: var(--paper); cursor: pointer; font-size: 11px; }
    button.secondary { background: transparent; color: var(--ink); }
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 18px; margin: 15px 0 0; color: var(--muted); font-size: 10px; }
    .status.error { color: var(--coral); }
    .status.success { color: #276b35; }
    .preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 22px; }
    .preview-card { border: 1px solid var(--ink); padding: 15px; background: var(--paper); }
    .preview-card small { display: block; color: var(--muted); font: 10px monospace; text-transform: uppercase; }
    .preview-card strong { display: block; margin-top: 8px; font-size: 28px; letter-spacing: -.05em; }
    .locked { opacity: .45; pointer-events: none; }
    @media (max-width: 650px) { .auth-grid, .variables, .preview { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">Atlas / API playground</div>
    <h1>Edit dashboard <em>variables.</em></h1>
    <p class="intro">A basic visual example for testing the account API. Sign in, change the values below, and save them to the authenticated dashboard.</p>

    <section class="panel" id="authPanel">
      <h2>1 / Sign in</h2>
      <div class="auth-grid">
        <label>Email<input id="email" type="email" placeholder="you@example.com" autocomplete="email"></label>
        <label>Password<input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password"></label>
      </div>
      <div class="actions">
        <button id="login" type="button">Log in</button>
        <button id="register" class="secondary" type="button">Create account</button>
      </div>
      <p class="status" id="authStatus" role="status"></p>
    </section>

    <section class="panel locked" id="editorPanel">
      <h2>2 / Edit variables</h2>
      <div class="variables">
        <label>Visits label<input class="metric-label" data-key="visits" value="Monthly visits"></label>
        <label>Visits value<input class="metric-value" data-key="visits" type="number" min="0" step="0.1" value="1284"></label>
        <label>Projects label<input class="metric-label" data-key="projects" value="Active projects"></label>
        <label>Projects value<input class="metric-value" data-key="projects" type="number" min="0" step="0.1" value="24"></label>
        <label>Conversion label<input class="metric-label" data-key="conversion" value="Conversion rate"></label>
        <label>Conversion value<input class="metric-value" data-key="conversion" type="number" min="0" step="0.1" value="18.6"></label>
        <label>Uptime label<input class="metric-label" data-key="uptime" value="Service uptime"></label>
        <label>Uptime value<input class="metric-value" data-key="uptime" type="number" min="0" step="0.1" value="99.9"></label>
        <label>Accent color<input id="accentColor" type="color" value="#ff674d"></label>
        <label>Card density<select id="density"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></label>
      </div>
      <div class="actions">
        <button id="save" type="button">Save through API</button>
        <button id="reload" class="secondary" type="button">Reload values</button>
        <button id="logout" class="secondary" type="button">Log out</button>
      </div>
      <p class="status" id="editorStatus" role="status"></p>
      <div class="preview" id="preview"></div>
    </section>
  </main>

  <script>
    const authPanel = document.getElementById('authPanel');
    const editorPanel = document.getElementById('editorPanel');
    const authStatus = document.getElementById('authStatus');
    const editorStatus = document.getElementById('editorStatus');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const keys = ['visits', 'projects', 'conversion', 'uptime'];

    function setStatus(element, message, type = '') {
      element.textContent = message;
      element.className = `status ${type}`;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      const text = await response.text();
      let body;
      try { body = JSON.parse(text); } catch { throw new Error(`Server returned a non-JSON response (${response.status}).`); }
      if (!response.ok) throw new Error(body.error || 'API request failed');
      return body;
    }

    function showEditor() {
      editorPanel.classList.remove('locked');
      authPanel.style.opacity = '.6';
    }

    function collectPayload() {
      const metrics = Object.fromEntries(keys.map((key) => [key, {
        label: document.querySelector(`.metric-label[data-key="${key}"]`).value,
        value: Number(document.querySelector(`.metric-value[data-key="${key}"]`).value)
      }]));
      return { metrics, preferences: { accent_color: document.getElementById('accentColor').value, density: document.getElementById('density').value } };
    }

    function renderPreview(data) {
      document.getElementById('preview').innerHTML = data.metrics.map((metric) => `<article class="preview-card"><small>${metric.metric_label}</small><strong>${metric.metric_value}${['conversion', 'uptime'].includes(metric.metric_key) ? '%' : ''}</strong></article>`).join('');
    }

    function loadFields(data) {
      data.metrics.forEach((metric) => {
        document.querySelector(`.metric-label[data-key="${metric.metric_key}"]`).value = metric.metric_label;
        document.querySelector(`.metric-value[data-key="${metric.metric_key}"]`).value = metric.metric_value;
      });
      document.getElementById('accentColor').value = data.preferences?.accent_color || '#ff674d';
      document.getElementById('density').value = data.preferences?.density || 'comfortable';
      renderPreview(data);
    }

    async function loadDashboard() {
      const data = await api('/api/dashboard');
      showEditor();
      loadFields(data);
    }

    async function authenticate(path) {
      setStatus(authStatus, 'Working...');
      document.getElementById('login').disabled = true;
      document.getElementById('register').disabled = true;
      try {
        await api(path, { method: 'POST', body: JSON.stringify({ email: email.value, password: password.value }) });
        await loadDashboard();
        setStatus(authStatus, 'Authenticated.', 'success');
      } catch (error) {
        setStatus(authStatus, error.message, 'error');
      } finally {
        document.getElementById('login').disabled = false;
        document.getElementById('register').disabled = false;
      }
    }

    document.getElementById('login').addEventListener('click', () => authenticate('/api/auth/login'));
    document.getElementById('register').addEventListener('click', () => authenticate('/api/auth/register'));
    document.getElementById('save').addEventListener('click', async () => {
      setStatus(editorStatus, 'Saving...');
      try {
        const result = await api('/api/dashboard/update', { method: 'POST', body: JSON.stringify(collectPayload()) });
        await loadDashboard();
        setStatus(editorStatus, result.ok ? 'Saved through the API.' : 'Saved.', 'success');
      } catch (error) {
        setStatus(editorStatus, error.message, 'error');
      }
    });
    document.getElementById('reload').addEventListener('click', async () => {
      try { await loadDashboard(); setStatus(editorStatus, 'Values reloaded.', 'success'); } catch (error) { setStatus(editorStatus, error.message, 'error'); }
    });
    document.getElementById('logout').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST', body: '{}' });
      editorPanel.classList.add('locked');
      setStatus(authStatus, 'Logged out.');
    });

    loadDashboard().catch(() => {});
  </script>
</body>
</html>
